# ThreatSight — CI/CD Pipeline
# GitHub'a her push/PR'da otomatik calisir.

name: ThreatSight CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python 3.10 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Bagimliliklar yukle
        run: |
          pip install --upgrade pip
          pip install ultralytics opencv-python-headless torch torchvision PyYAML numpy pytest flake8

      - name: Lint - kod stili kontrol
        run: |
          flake8 src/ scripts/ --max-line-length=100 --exclude=__pycache__ --ignore=E501,W503

      - name: Unit testleri calistir
        run: |
          pytest tests/ -v --tb=short

  model-check:
    name: Model Smoke Test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Bagimliliklar yukle
        run: |
          pip install ultralytics torch torchvision PyYAML numpy

      - name: YOLOv8 yuklenebilir mi
        run: |
          python -c "from ultralytics import YOLO; m = YOLO('yolov8n.pt'); print('Model OK')"

      - name: Config gecerli mi
        run: |
          python -c "import yaml; cfg = yaml.safe_load(open('config/config.yaml')); assert 'model' in cfg; assert 'threat' in cfg; assert 'alerts' in cfg; print('Config OK')"
