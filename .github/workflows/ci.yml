# ThreatSight — CI/CD Pipeline
# GitHub'a her push/PR'da otomatik çalışır.

name: ThreatSight CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python 3.10 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Bağımlılıkları yükle
        run: |
          pip install --upgrade pip
          pip install ultralytics opencv-python-headless torch torchvision \
                      PyYAML numpy pytest flake8

      - name: Lint — kod stili kontrol (flake8)
        run: |
          flake8 src/ scripts/ --max-line-length=100 \
            --exclude=__pycache__ \
            --ignore=E501,W503

      - name: Unit testleri çalıştır
        run: |
          pytest tests/ -v --tb=short

  model-check:
    name: Model Smoke Test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Bağımlılıkları yükle
        run: pip install ultralytics torch torchvision PyYAML numpy

      - name: YOLOv8 yüklenebilir mi?
        run: python -c "from ultralytics import YOLO; m = YOLO('yolov8n.pt'); print('Model OK:', m.info())"

      - name: Config geçerli mi?
        run: python -c "
import yaml
with open('config/config.yaml') as f:
    cfg = yaml.safe_load(f)
assert 'model' in cfg, 'model section missing'
assert 'threat' in cfg, 'threat section missing'
assert 'alerts' in cfg, 'alerts section missing'
print('Config OK — tüm alanlar mevcut')
"
