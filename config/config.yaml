# ThreatSight Configuration

model:
  # Eğitilmiş custom model varsa: models/threat_v1_best.pt
  # Yoksa COCO modeli ile devam: yolov8n
  weights: yolov8n
  model_path: null          # Eğitim sonrası buraya: models/threat_v1_best.pt
  device: cuda
  confidence: 0.4
  iou_threshold: 0.45
  max_detections: 50
  half_precision: true
camera:
  source: 0                    # 0=webcam, "video.mp4", "rtsp://..."
  fps_limit: 30
  resolution: [1280, 720]
threat:
  levels:
    person: 1
    car: 1
    truck: 2
    motorcycle: 1
    knife: 3
    gun: 3
    backpack: 1
    handbag: 1
    airplane: 2
    helicopter: 3
    drone: 3
  multi_threat_multiplier: 1.5

alerts:
  enabled: true
  cooldown_seconds: 5
  high_threat_threshold: 3

logging:
  enabled: true
  db_path: "logs/events.db"
  save_snapshots: true
  snapshot_dir: "logs/snapshots"

display:
  show_fps: true
  show_confidence: true
  show_threat_level: true
  bbox_thickness: 2